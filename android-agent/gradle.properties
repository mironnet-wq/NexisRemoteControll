# Habilitar suporte a bibliotecas AndroidX (obrigatorio para projetos modernos)
android.useAndroidX=true

# Habilitar o Jetifier para converter automaticamente bibliotecas legadas para AndroidX
android.enableJetifier=true

# Configurar memoria do Gradle para compilacao mais rapida
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Impedir que o Gradle injete android:testOnly=true em APKs de debug
android.injected.testOnly=false
